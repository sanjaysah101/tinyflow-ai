<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="tf-mark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="tf-mark-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="tf-mark-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="tf-text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>
    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ── Emblem / Icon Mark (Left 48x48) ── -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#tf-mark-bg)" stroke="url(#tf-mark-glow)" stroke-width="1.8" stroke-opacity="0.8"/>
    
    <!-- Top T-Flow -->
    <path d="M11 15 C17 15, 22 12, 28 14.5 C34 17, 36 14, 38 13.5" stroke="url(#tf-mark-glow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#mark-glow)"/>
    
    <!-- Vertical Spine Flow -->
    <path d="M22 14 L22 37 C22 39.5, 24.5 40.5, 27 39.5" stroke="url(#tf-mark-glow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- F-Bar Flow -->
    <path d="M22 25.5 C26.5 25.5, 30.5 23, 35.5 24.5" stroke="url(#tf-mark-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dynamic Multi-Agent Gateway Nodes -->
    <circle cx="12" cy="15" r="2.2" fill="#c084fc" />
    <circle cx="37" cy="13.5" r="2.2" fill="#38bdf8" />
    <circle cx="35" cy="24.5" r="2.2" fill="#34d399" />
    <circle cx="27" cy="39.5" r="2.2" fill="#818cf8" />
  </g>

  <!-- ── Logotype Typography ── -->
  <text x="70" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="url(#tf-text-gradient)" letter-spacing="-0.5">TinyFlow</text>
  <rect x="168" y="20" width="34" height="20" rx="5" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
  <text x="175" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#a5b4fc" letter-spacing="0.5">AI</text>
  <text x="71" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#71717a" letter-spacing="0.2">POWERED BY MOZILLA OTARI</text>
</svg>

